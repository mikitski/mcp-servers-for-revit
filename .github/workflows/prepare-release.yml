name: Prepare Release

# Manually triggered: bumps the version in server/package.json,
# server/package-lock.json, and plugin/Properties/AssemblyInfo.cs on a new
# release/vX.Y.Z branch, then opens a PR into main. Merging that PR is what
# actually cuts the release (see release.yml).

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 1.2.3"
        required: true

permissions:
  contents: write
  pull-requests: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - name: Validate version format
        run: |
          if ! [[ "${{ inputs.version }}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version must be in X.Y.Z format, got '${{ inputs.version }}'"
            exit 1
          fi

      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Create release branch
        run: git checkout -b "release/v${{ inputs.version }}"

      - name: Bump server/package.json + package-lock.json
        working-directory: server
        run: |
          npm version "${{ inputs.version }}" --no-git-tag-version --allow-same-version
          npm install --package-lock-only

      - name: Bump plugin/Properties/AssemblyInfo.cs
        run: |
          sed -i -E "s/AssemblyVersion\(\"[^\"]+\"\)/AssemblyVersion(\"${{ inputs.version }}.0\")/" plugin/Properties/AssemblyInfo.cs
          sed -i -E "s/AssemblyFileVersion\(\"[^\"]+\"\)/AssemblyFileVersion(\"${{ inputs.version }}.0\")/" plugin/Properties/AssemblyInfo.cs

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add server/package.json server/package-lock.json plugin/Properties/AssemblyInfo.cs
          git commit -m "${{ inputs.version }}"
          git push -u origin "release/v${{ inputs.version }}"

      - name: Open pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr create \
            --base main \
            --head "release/v${{ inputs.version }}" \
            --title "Release v${{ inputs.version }}" \
            --body "Version bump for v${{ inputs.version }}. Merging this into \`main\` triggers the release workflow, which builds the plugin/command set for all supported Revit versions and publishes a GitHub release."
